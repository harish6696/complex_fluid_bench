model_name: CNO
cno_depth: 5 #number of down/up sampling blocks in the network
n_blocks: 6 #number of residual blocks per level (except the neck)
n_blocks_bottleneck: 7 #number of residual blocks in the bottleneck
channel_multiplier: 32 #base channel multiplier for network width
latent_channels: 64 #number of channels in latent space of the lifting/projection block
norm_layer_eps: 1e-5
norm: 'batch' # layer, batch, group, identity