########################################################
# Training parameters
########################################################
#use_cpu
use_cpu: False
# Batch size for train and eval
per_device_train_batch_size: 16
per_device_eval_batch_size: 16
# Number of training epochs
num_train_epochs: 128
#To use mix precison training
mix_precision_config:
  fp16: False
  bf16: False
  tf32: False
#number of workers for dataloader
dataloader_num_workers: 4
#gradient accumulation steps for increasing effective batch size
gradient_accumulation_steps: 1
########################################################
# Evaluation parameters
########################################################
# % of train.h5 dataset used for evaluation
#Validation, log and save strategies: 
eval_strategy: "epoch" #options are steps, epoch or no.
eval_steps: 5 #only used if eval_strategy is steps
logging_strategy: "epoch" #options are steps, epoch or no.
logging_steps: 1 #only used if logging_strategy is steps
save_strategy: "epoch" #options are steps, epoch or no 
#NOTE: save_strategy must be same as eval_strategy for loading the best model at the end for one last validation to obtain the best plot.
save_steps: 5 #only used if save_strategy is steps
save_total_limit: 1 #Limits the total amount of checkpoints to the best two. Deletes the older checkpoints in the output_dir.
# Number of steps to accumulate predictions on GPU before moving to CPU
eval_accumulation_steps: 16
# Ratio of train.h5 dataset used for evaluation
eval_split_ratio: 0.2
#metric for best model
metric_for_best_model: "l2_error"
# Number of rollouts to use for evaluation
n_eval_rollouts: 4
# Plot after epochs, 
# If a single float is provided, plotting will be done continously after this epoch is reached.
# If a list is provided, plotting will be done "once" after each epoch in the list.
# If null, then plotting is done after every validation step.
plot_after_epoch: [1, 5, 10, 50, 100, 127]
# Number of examples to plot from the validation window and see how the training progresses over epochs for the same examples
n_eval_plot_examples: 1
#############################################################
# Hugging-Face Hub options
#############################################################
push_to_hub: False
hub_strategy: "end"

